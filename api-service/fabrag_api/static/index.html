<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FabRAG</title>
  <style>
    body { font: 16px system-ui; max-width: 760px; margin: 3rem auto; padding: 0 1rem; color: #17202a; }
    textarea, input { box-sizing: border-box; width: 100%; padding: .75rem; margin: .4rem 0 1rem; }
    button { padding: .65rem 1rem; margin-right: .4rem; cursor: pointer; }
    #result { white-space: pre-wrap; background: #f4f6f7; padding: 1rem; margin-top: 1rem; }
    .muted { color: #657; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>FabRAG</h1>
  <p class="muted">Grounded answers over electronics datasheets. Verify critical values in the cited PDF.</p>
  <label>API key<input id="apiKey" type="password" autocomplete="off"></label>
  <label>Question<textarea id="question" rows="4" maxlength="2000"></textarea></label>
  <button id="ask">Ask</button>
  <div id="result" hidden></div>
  <div id="feedback" hidden>
    <p>Was this answer useful?</p>
    <button data-rating="up">👍 Yes</button><button data-rating="down">👎 No</button>
  </div>
  <script>
    let answerId = null;
    const key = () => document.querySelector('#apiKey').value;
    document.querySelector('#ask').onclick = async () => {
      const result = document.querySelector('#result');
      result.hidden = false; result.textContent = 'Loading…';
      const response = await fetch('/v1/answers', {method: 'POST', headers: {'Content-Type': 'application/json', 'X-API-Key': key()}, body: JSON.stringify({question: document.querySelector('#question').value})});
      const data = await response.json();
      if (!response.ok) { result.textContent = data.detail || 'Request failed'; return; }
      answerId = data.answer_id;
      const sources = data.sources.map(s => `[${s.source_id}] ${s.filename}, pages ${s.page_start}-${s.page_end}`).join('\n');
      result.textContent = `${data.answer}\n\nRoute: ${data.route}\n${sources}`;
      document.querySelector('#feedback').hidden = false;
    };
    document.querySelectorAll('[data-rating]').forEach(button => button.onclick = async () => {
      if (!answerId) return;
      const response = await fetch('/v1/feedback', {method: 'POST', headers: {'Content-Type': 'application/json', 'X-API-Key': key()}, body: JSON.stringify({answer_id: answerId, rating: button.dataset.rating})});
      if (response.ok) document.querySelector('#feedback').textContent = 'Thank you for the feedback.';
    });
  </script>
</body>
</html>
