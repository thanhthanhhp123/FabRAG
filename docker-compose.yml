services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fabrag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fabrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fabrag}
      POSTGRES_DB: ${POSTGRES_DB:-fabrag}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ingestion-worker/src/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fabrag} -d ${POSTGRES_DB:-fabrag}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
