[project]
name = "fabrag-evaluation"
version = "0.1.0"
description = "Offline retrieval and reranking evaluation for FabRAG"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
fabrag-evaluate = "fabrag_eval.evaluate:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = [".", "../ingestion-worker"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["fabrag_eval*"]
