[project]
name = "fabrag-ingestion-worker"
version = "0.1.0"
description = "PDF parse -> chunk -> embed -> store pipeline for FabRAG"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
    "sentence-transformers>=3.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
